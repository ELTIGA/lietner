<!-- Lietner sign-in code. Shows only the code, never a link: links open Safari instead of the installed iOS app. -->
<h2 style="font-family: Georgia, serif; color: #2a2420">Your Lietner sign-in code</h2>
<p style="font-family: system-ui, sans-serif; color: #2a2420">Enter this code in Lietner to sign in:</p>
<p style="font-family: ui-monospace, monospace; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #2a2420">{{ .Token }}</p>
<p style="font-family: system-ui, sans-serif; color: #6b5d50; font-size: 14px">The code expires in one hour. If you didn't ask for it, you can ignore this email.</p>
